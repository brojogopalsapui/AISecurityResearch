<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">In-house AI security lab setup preview</title>
  <desc id="desc">A compact technical visual of a GPU workstation connected to edge devices, a gateway, an FPGA board, and an isolated lab network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".5" stop-color="#0b1b31"/>
      <stop offset="1" stop-color="#1b1627"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" x2="1">
      <stop offset="0" stop-color="#6aa9ff"/>
      <stop offset=".55" stop-color="#45d1c7"/>
      <stop offset="1" stop-color="#ffb454"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#263b5f"/>
      <stop offset="1" stop-color="#080d17"/>
    </linearGradient>
    <linearGradient id="board" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#45d1c7"/>
      <stop offset="1" stop-color="#167586"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity=".34"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="720" height="480" rx="34" fill="url(#bg)"/>
  <circle cx="84" cy="74" r="52" fill="#6aa9ff" opacity=".16"/>
  <circle cx="626" cy="82" r="72" fill="#ffb454" opacity=".13"/>
  <circle cx="594" cy="398" r="98" fill="#45d1c7" opacity=".11"/>

  <g filter="url(#shadow)">
    <path d="M74 356h572l34 66H40l34-66Z" fill="#0e1728"/>
    <path d="M74 356h572" stroke="url(#desk)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g transform="translate(70 112)" filter="url(#shadow)">
    <rect x="0" y="0" width="142" height="210" rx="22" fill="url(#tower)"/>
    <rect x="16" y="18" width="110" height="46" rx="12" fill="#1b3357" stroke="#6aa9ff" stroke-opacity=".42"/>
    <rect x="16" y="82" width="110" height="88" rx="14" fill="#0d1525" stroke="#405b84"/>
    <circle cx="48" cy="126" r="22" fill="none" stroke="#45d1c7" stroke-width="5" opacity=".86"/>
    <circle cx="92" cy="126" r="22" fill="none" stroke="#a48cff" stroke-width="5" opacity=".86"/>
    <text x="71" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff">GPU Workstation</text>
  </g>

  <g transform="translate(282 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="96" rx="18" fill="#101b2d" stroke="#385174"/>
    <rect x="18" y="26" width="58" height="46" rx="10" fill="url(#board)"/>
    <rect x="92" y="28" width="42" height="42" rx="8" fill="#070d15"/>
    <circle cx="145" cy="49" r="11" fill="#45d1c7"/>
    <text x="85" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#f2f7ff">Jetson Orin Nano</text>
    <text x="85" y="86" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#9bb0c8">edge inference target</text>
  </g>

  <g transform="translate(488 92)" filter="url(#shadow)">
    <rect x="0" y="0" width="128" height="92" rx="18" fill="#101b2d" stroke="#385174"/>
    <rect x="19" y="28" width="90" height="38" rx="10" fill="#167586"/>
    <circle cx="38" cy="47" r="7" fill="#dffdf9"/>
    <circle cx="64" cy="47" r="7" fill="#dffdf9"/>
    <circle cx="90" cy="47" r="7" fill="#dffdf9"/>
    <text x="64" y="19" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#f2f7ff">Raspberry Pi</text>
    <text x="64" y="81" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#9bb0c8">gateway</text>
  </g>

  <g transform="translate(292 238)" filter="url(#shadow)">
    <rect x="0" y="0" width="150" height="94" rx="18" fill="#101b2d" stroke="#385174"/>
    <rect x="18" y="26" width="114" height="48" rx="10" fill="#2d2215" stroke="#ffb454"/>
    <rect x="32" y="38" width="30" height="24" rx="5" fill="#ffb454" opacity=".95"/>
    <rect x="72" y="38" width="44" height="24" rx="5" fill="#a48cff" opacity=".92"/>
    <text x="75" y="20" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#f2f7ff">Zynq-7020 FPGA</text>
    <text x="75" y="86" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#9bb0c8">PL/PS security tests</text>
  </g>

  <g transform="translate(500 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="128" height="78" rx="16" fill="#101b2d" stroke="#385174"/>
    <rect x="21" y="24" width="86" height="28" rx="8" fill="#203a64"/>
    <g fill="#45d1c7">
      <circle cx="36" cy="38" r="4"/>
      <circle cx="53" cy="38" r="4"/>
      <circle cx="70" cy="38" r="4"/>
      <circle cx="87" cy="38" r="4"/>
    </g>
    <text x="64" y="18" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#f2f7ff">Lab LAN</text>
    <text x="64" y="68" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#9bb0c8">isolated switch</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".98">
    <path d="M212 218 C258 198 272 151 282 128" stroke="#6aa9ff" stroke-width="4"/>
    <path d="M452 128 C478 134 488 138 505 138" stroke="#45d1c7" stroke-width="4"/>
    <path d="M442 286 C464 287 480 289 500 289" stroke="#ffb454" stroke-width="4"/>
    <path d="M212 244 C250 260 260 280 292 286" stroke="#a48cff" stroke-width="4" stroke-dasharray="8 9"/>
    <path d="M564 250 C556 219 552 190 552 184" stroke="#45d1c7" stroke-width="4" stroke-dasharray="6 8"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="260" cy="197" r="5" fill="#6aa9ff"/>
    <circle cx="476" cy="134" r="5" fill="#45d1c7"/>
    <circle cx="470" cy="288" r="5" fill="#ffb454"/>
    <circle cx="250" cy="260" r="5" fill="#a48cff"/>
  </g>

  <g transform="translate(78 38)">
    <rect x="0" y="0" width="196" height="38" rx="19" fill="#101b2d" stroke="#385174"/>
    <circle cx="22" cy="19" r="6" fill="#00ffa3"/>
    <text x="40" y="24" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#f2f7ff">live lab attack theater</text>
  </g>

  <g transform="translate(422 368)">
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#06101f" opacity=".96" stroke="#385174"/>
    <text x="110" y="26" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff">A/D threat paths mapped here</text>
  </g>
</svg>
